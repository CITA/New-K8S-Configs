apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: cita-pdf
data:
  default.conf: |
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    upstream app_server {
      server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    }

    access_log /var/log/nginx/access_log;
    error_log /var/log/nginx/error_log;

    server {
      server_name icat.cita.utoronto.ca;
      listen 80 default_server;
      listen [::]:80 default_server;
      listen 443 ssl http2;

      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:50m;
      ssl_session_tickets on;

      ssl_certificate /etc/nginx/ssl/fullchain.pem;
      ssl_certificate_key /etc/nginx/ssl/cita-wildcard.key;

      add_header Strict-Transport-Security "max-age=31536000" always;

      location / {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://app_server;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
      }

      location /uploads/ {
        alias /PDF_app_site/uploads/;

        expires off;
        etag off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
      }

      error_page 500 502 503 504 /500.html;

      client_max_body_size 100m;
    }
