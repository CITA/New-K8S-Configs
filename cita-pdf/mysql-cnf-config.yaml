apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-cnf-config
  namespace: cita-pdf
data:
  mysqld.cnf: |
    [mysqld]
    pid-file = /var/run/mysqld/mysqld.pid
    socket = /var/run/mysqld/mysqld.sock
    datadir = /var/lib/mysql
    symbolic-links=0
    query_cache_type=1
    query_cache_size = 10M
    query_cache_limit=256K
    innodb_buffer_pool_size=1G
