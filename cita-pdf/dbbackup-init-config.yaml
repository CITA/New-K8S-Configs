apiVersion: v1
kind: ConfigMap
metadata:
  name: dbbackup-init
  namespace: cita-pdf
data:
  dbbackup-init.sh: |
    #!/bin/bash
    set -eu

    DBBACKUP_PASSWORD="$(cat /run/secrets/dbbackup/password)"

    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<SQL
    CREATE USER IF NOT EXISTS 'dbbackup'@'localhost' IDENTIFIED BY '${DBBACKUP_PASSWORD}';
    ALTER USER 'dbbackup'@'localhost' IDENTIFIED BY '${DBBACKUP_PASSWORD}';
    GRANT SELECT, LOCK TABLES, SHOW VIEW, TRIGGER
      ON app_database.* TO 'dbbackup'@'localhost';
    FLUSH PRIVILEGES;
    SQL
