apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cita-forms
data:
  DEFAULT_PUB_YEAR: "2024"
  SURF_APPLICATION_START_TIME: "2025-12-15 00:00:00"
  SURF_APPLICATION_END_TIME: "2026-01-30 23:59:59"
  AGM_MEETING: "2026-06-23 13:00:00"
  AGM_VOTE_DEADLINE: "2026-06-22 23:59:59"
  AGM_DEFAULT_PROXY: ""
  gen_targz_hour: "23"
  gen_targz_minute: "10"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb-config
  namespace: cita-forms
data:
  initdb.sql: |
    CREATE DATABASE IF NOT EXISTS app_database;

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-cnf-config
  namespace: cita-forms
data:
  mysqld.cnf: |
    [mysqld]
    pid-file    = /var/run/mysqld/mysqld.pid
    socket              = /var/run/mysqld/mysqld.sock
    datadir             = /var/lib/mysql
    #log-error  = /var/log/mysql/error.log
    # By default we only accept connections from localhost
    #bind-address       = 127.0.0.1
    # Disabling symbolic-links is recommended to prevent assorted security risks
    symbolic-links=0
    #max_allowed_packet=256M
    #wait_timeout=90000
    query_cache_type=1
    query_cache_size = 10M
    query_cache_limit=256K
    #query_cache_min_res_unit=2k
    innodb_buffer_pool_size=600M

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: cita-forms
data:
  default.conf: |
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    upstream app_server {
      # All containers in the same pod are reachable with 127.0.0.1
      server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    }

    server {
      server_name cita-forms.cita.utoronto.ca;

      # HTTP is intentionally not enabled.
      #listen 80 default_server;
      #listen [::]:80 default_server;

      listen 443 ssl http2;

      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:50m;
      ssl_session_tickets on;

      ssl_certificate /etc/nginx/ssl/cita-wildcard.crt;
      ssl_certificate_key /etc/nginx/ssl/cita-wildcard.key;

      add_header Strict-Transport-Security "max-age=31536000" always;

      location / {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://app_server;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
      }

      location /uploads/ {
        alias /FORMS/uploads/;
      }

      error_page 500 502 503 504 /500.html;

      client_max_body_size 100m;
    }
