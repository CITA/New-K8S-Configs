apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ConfigMaps
  - configmaps/new-apache-vhost-config.yaml
  - configmaps/new-citawiki-php.yaml
  - configmaps/configmap-php-confd.yaml
  - configmaps/postfix-main-cf.yaml

  # Secrets
  - secrets/apache2-certs-keys.yaml
  - secrets/new-citawiki-app-secret.yaml
  - secrets/new-citawiki-db-secret.yaml
  - secrets/dockerhub-credential.yaml
  - secrets/dbbackup-secret.yaml

  # Services
  - db-service.yaml
  - web-service.yaml

  # Deployments
  - db-deployment.yaml
  - web-deployment.yaml
