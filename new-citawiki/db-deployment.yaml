apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-citawiki-db
  namespace: cita-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-citawiki-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: new-citawiki-db
    spec:
      imagePullSecrets:
        - name: dockerhub-credential
      terminationGracePeriodSeconds: 60
      containers:
        - name: db
          image: docker.io/citadockerhub/mariadb:11.4.13-ubu2404-cita1
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: new-citawiki-db-secret
                  key: root_password
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1500Mi
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: new-citawiki-db-pvc
