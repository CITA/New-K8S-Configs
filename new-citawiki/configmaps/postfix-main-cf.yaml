    #\ndebugger_command =\n\t PATH=/bin:/usr/bin:/usr/local/bin:/usr/X11R6/bin\n\t\
    \ ddd $daemon_directory/$process_name $process_id & sleep 5\n\n# If you can't\
    \ use X, use this to capture the call stack when a\n# daemon crashes. The result\
    \ is in a file in the configuration\n# directory, and is named after the process\
