    sendmail_path = /usr/sbin/sendmail\n\n# newaliases_path: The full pathname of\
    \ the Postfix newaliases command.\n# This is the Sendmail-compatible command to\
    \ build alias databases.\n#\n#newaliases_path = /usr/bin/newaliases.postfix\n\
    newaliases_path = /usr/bin/newaliases\n\n# mailq_path: The full pathname of the\
    \ Postfix mailq command.  This\n# is the Sendmail-compatible mail queue listing\
    \ command.\n# \n#mailq_path = /usr/bin/mailq.postfix\nmailq_path = /usr/bin/mailq\n\
    \n# setgid_group: The group for mail submission and queue management\n# commands.\
    \  This must be a group name with a numerical group ID that\n# is not shared with\
