apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cita-indico

resources:
  # ConfigMaps
  - indico-config.yaml
  - nginx-config.yaml
  - postgres-init.yaml

  # PostgreSQL
  - postgres.yaml

  # Redis
  - redis.yaml

  # Celery workers and scheduler
  - indico-celery.yaml

  # Indico web application
  - indico-web.yaml

  # External Service
  - service.yaml
