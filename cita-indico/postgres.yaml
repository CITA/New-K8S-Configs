apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cita-indico
spec:
  clusterIP: None
  selector:
    app: indico-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indico-postgres
  namespace: cita-indico
spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: indico-postgres

  template:
    metadata:
      labels:
        app: indico-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:13

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: indico-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: indico-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indico-postgres-secret
                  key: POSTGRES_PASSWORD

          ports:
            - name: postgres
              containerPort: 5432

          volumeMounts:
            - name: indico-pvc
              mountPath: /var/lib/postgresql/data
              subPath: postgres

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi

      volumes:
        - name: indico-pvc
          persistentVolumeClaim:
            claimName: indico-pvc

        - name: postgres-init
          configMap:
            name: postgres-init
