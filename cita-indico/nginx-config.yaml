apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: cita-indico
data:
  default.conf: |
    upstream indico {
      server 127.0.0.1:59999;
      keepalive 32;
    }

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    server {
      listen 80;
      listen [::]:80;

      server_name conference.cita.utoronto.ca;

      return 301 https://$host$request_uri;
    }

    server {
      listen 443 ssl;
      http2 on;

      server_name conference.cita.utoronto.ca;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_certificate /etc/nginx/ssl/cita-wildcard.crt;
      ssl_certificate_key /etc/nginx/ssl/cita-wildcard.key;

      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;

      location ~ ^/(images|fonts)/(.*)$ {
        alias /opt/indico/static-shared/$1/$2;
        expires 7d;
        add_header Cache-Control "max-age=604800, public";
      }

      location ~ ^/(css|dist)/(.*)$ {
        alias /opt/indico/static-shared/$1/$2;
        expires 7d;
        add_header Cache-Control "max-age=604800, public";
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://indico;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 900s;
      }
    }
