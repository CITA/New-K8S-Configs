apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-apps-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-apps-pool
  interfaces:
    - br0
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: vma
    - matchLabels:
        kubernetes.io/hostname: vmb
