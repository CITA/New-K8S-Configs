apiVersion: v1
kind: ConfigMap
metadata:
  name: cita-site-apache
  namespace: cita-site-website
data:
  site.cita.utoronto.ca.conf: |
    Listen 443 https

    <VirtualHost *:80>
        ServerName site.cita.utoronto.ca

        Redirect / https://site.cita.utoronto.ca/

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
    </VirtualHost>

    <VirtualHost *:443>
        ServerName site.cita.utoronto.ca
        DocumentRoot /usr/share/wordpress

        <Directory /usr/share/wordpress>
            AllowOverride All
            Require all granted
        </Directory>

        SSLEngine on
        SSLCertificateFile /etc/httpd/tls/tls.crt
        SSLCertificateKeyFile /etc/httpd/tls/tls.key
        SSLCertificateChainFile /etc/httpd/tls/ca-bundle.crt

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
    </VirtualHost>
