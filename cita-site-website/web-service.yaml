apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    app: cita-site-website
  name: cita-site-website
  namespace: cita-site-website
spec:
  internalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
  selector:
    app: cita-site-website
  sessionAffinity: None
  type: ClusterIP
