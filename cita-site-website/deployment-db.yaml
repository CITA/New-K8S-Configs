apiVersion: apps/v1
kind: Deployment
metadata:
  name: cita-site-mariadb
  namespace: cita-site-website
  labels:
    app: cita-site-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cita-site-mariadb
  template:
    metadata:
      labels:
        app: cita-site-mariadb
    spec:
      nodeSelector:
        cita.utoronto.ca/application-node: "true"
      containers:
        - name: mariadb
          image: mariadb:10.5
          imagePullPolicy: IfNotPresent

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cita-site-mariadb-root
                  key: root-password

          ports:
            - name: mysql
              containerPort: 3306

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: cita-site-database-pvc
