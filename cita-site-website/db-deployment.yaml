apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: cita-site-mariadb
  name: cita-site-mariadb
  namespace: cita-site-website
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cita-site-mariadb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cita-site-mariadb
    spec:
      containers:
        - env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: root-password
                  name: cita-site-mariadb-root
          image: mariadb:10.5
          imagePullPolicy: IfNotPresent
          name: mariadb
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" --silent
            failureThreshold: 12
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: database
      dnsPolicy: ClusterFirst
      nodeSelector:
        cita.utoronto.ca/application-node: "true"
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: cita-site-database-pvc
