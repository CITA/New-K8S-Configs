apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cita-site-website

resources:
  # ConfigMaps
  - apache-config.yaml
  - php-config.yaml
  - userdir-config.yaml
  - wordpress-config.yaml

  # Secrets
  - secrets/secret-mariadb-root.yaml
  - secrets/secret-wordpress.yaml
  - secrets/secret-dockerhub.yaml

  # Services
  - db-service.yaml
  - web-service.yaml
  - web-external-service.yaml

  # Deployments
  - db-deployment.yaml
  - web-deployment.yaml
